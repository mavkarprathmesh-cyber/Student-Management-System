databases:
  - name: sms-database
    databaseName: sms_db
    user: sms_user
    plan: free

services:
  # 1. Backend Express REST API
  - type: web
    name: sms-backend-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build:prod
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sms-database
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads

  # 2. Frontend React + Vite SPA
  - type: web
    name: sms-frontend-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
